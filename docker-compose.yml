services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: card_reward
      POSTGRES_USER: card_reward
      POSTGRES_PASSWORD: card_reward
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card_reward"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - card_reward_pg:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://card_reward:card_reward@db:5432/card_reward
      APP_BASE_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s

volumes:
  card_reward_pg:
